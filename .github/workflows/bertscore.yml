name: Calculate BERTScore for variant 15

on:
  push:
    branches: [main]
    paths:
      - '**.py'
      - 'data/**'
      - 'requirements-bertscore.txt'
      - '.github/workflows/bertscore.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  evaluate-and-report:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-bertscore.txt

      - name: Install CPU PyTorch and BERTScore
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'torch>=2.6,<3' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-bertscore.txt

      - name: Check recognition metrics and unit tests
        run: |
          python -m unittest -v test_pdn.py
          python evaluate.py

      - name: Calculate real Russian BERTScore
        env:
          TOKENIZERS_PARALLELISM: 'false'
          HF_HUB_DISABLE_XET: '1'
        run: python evaluate.py --bertscore --model DeepPavlov/rubert-base-cased

      - name: Upload reproducible results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coursework-results
          path: |
            results/recognition_metrics.json
            results/bertscore_metrics.json
          if-no-files-found: warn
          retention-days: 30

      - name: Save measured BERTScore to the repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/recognition_metrics.json results/bertscore_metrics.json
          git commit -m 'Add BERTScore measurements for variant 15' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
