name: Calculate BERTScore and update coursework report

on:
  push:
    branches: [main]
    paths:
      - '**.py'
      - 'data/**'
      - 'requirements-bertscore.txt'
      - '.github/workflows/bertscore.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  evaluate-and-report:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install CPU PyTorch and report dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'torch>=2.6,<3' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-bertscore.txt python-docx matplotlib pymupdf

      - name: Check recognition metrics and unit tests
        run: |
          python -m unittest -v test_pdn.py
          python evaluate.py

      - name: Calculate real Russian BERTScore
        env:
          TOKENIZERS_PARALLELISM: 'false'
          HF_HUB_DISABLE_XET: '1'
        run: python evaluate.py --bertscore --model DeepPavlov/rubert-base-cased

      - name: Install LibreOffice if missing
        run: |
          if ! command -v soffice >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y libreoffice-writer fonts-liberation
          fi

      - name: Render report with actual BERTScore and update page index
        run: |
          python make_report.py docs/toc_pages.json
          soffice --headless --convert-to pdf --outdir docs docs/Курсовая_ПДн_ГОСТ_7.32_2017.docx
          python refresh_toc.py docs/Курсовая_ПДн_ГОСТ_7.32_2017.pdf docs/toc_pages.json
          python make_report.py docs/toc_pages.json
          soffice --headless --convert-to pdf --outdir docs docs/Курсовая_ПДн_ГОСТ_7.32_2017.docx

      - name: Upload reproducible results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coursework-results
          path: |
            results/recognition_metrics.json
            results/bertscore_metrics.json
            docs/Курсовая_ПДн_ГОСТ_7.32_2017.docx
            docs/Курсовая_ПДн_ГОСТ_7.32_2017.pdf
          if-no-files-found: warn
          retention-days: 30

      - name: Save measured BERTScore and updated report to the repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/recognition_metrics.json results/bertscore_metrics.json docs/toc_pages.json docs/Курсовая_ПДн_ГОСТ_7.32_2017.docx docs/Курсовая_ПДн_ГОСТ_7.32_2017.pdf
          git commit -m 'Add measured BERTScore and updated coursework report' || exit 0
          git push origin HEAD:main
